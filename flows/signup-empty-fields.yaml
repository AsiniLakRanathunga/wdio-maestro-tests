
appId: com.wdiodemoapp
---
- launchApp
- tapOn: "Login"
- tapOn: "Sign up"
- tapOn:
    text: "SIGN UP"
    below:
      text: "Confirm password"
- assertVisible: "Please enter a valid email address"
- assertVisible: "Please enter at least 8 characters"
- assertVisible: "Please enter the same password"

