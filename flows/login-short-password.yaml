appId: com.wdiodemoapp
---
- launchApp
- tapOn: "Login"
- tapOn: "Email"
- eraseText: 50
- inputText: "qa.signup@example.com"
- tapOn: "Password"
- eraseText: 50
- inputText: "short1"
- hideKeyboard
- tapOn:
    text: "LOGIN"
    below:
      text: "Password"
- assertVisible: "Please enter at least 8 characters"
